name = "keyvault-sidekick"
compatibility_date = "2026-06-08"
pages_build_output_dir = "public"

# D1 binding for users + invitations
[[d1_databases]]
binding = "DB"
database_name = "keyvault-sidekick-db"
database_id = "4cbb409d-4356-4007-b62f-58493498b279"

# Secrets set via `wrangler pages secret put` — DO NOT put values here:
#   SESSION_SECRET     — HMAC key for session cookies (32+ bytes)
#   INVITE_TOKEN_SECRET — HMAC key for invitation tokens (32+ bytes)

# ── Rate limiters (CF Workers Rate Limiting API) ─────────────────────────────
# Each binding is a fixed-window counter keyed by an arbitrary string the code
# provides. `period` must be 10 or 60 seconds. For longer windows (e.g. hourly
# account lockout), we use D1 in addition to these.

# LOGIN_LIMITER: 5 attempts per IP per 60 sec → fast burst protection.
# Account-level lockout (5/hour per email) is handled in D1.
[[rate_limiting]]
binding = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# INVITE_LIMITER: 10 attempts per IP per 60 sec on the accept-invite endpoint.
# Tokens are 256-bit so brute force is astronomical; this is cheap insurance.
[[rate_limiting]]
binding = "INVITE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# ADMIN_LIMITER: 30 requests per user.id per 10 sec.
# Prevents a compromised admin session from spamming invitations or scanning.
[[rate_limiting]]
binding = "ADMIN_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 10 }
