name = "keyvault-sidekick"
compatibility_date = "2026-06-08"
pages_build_output_dir = "public"

# KeyVault Sidekick is a 100% static, client-side app. No D1, no secrets, no
# server functions, no rate limiters — Cloudflare Pages just serves public/.
# Secrets are encrypted in the browser (AES-256-GCM) and never leave the device.
