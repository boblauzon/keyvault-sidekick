<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Admin · KeyVault Sidekick</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    main { max-width: 1280px; margin: 0 auto; padding: 40px 24px 100px; position: relative; z-index: 1; }
    .page-eyebrow { font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--teal-400); margin-bottom: 6px; }
    .page-title { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; color: white; margin: 0; }
    .page-lede { color: var(--text-dim); margin: 8px 0 0 0; font-size: 14px; }

    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 32px; }
    @media (max-width: 980px) { .admin-grid { grid-template-columns: 1fr; } }

    .panel {
      background: rgba(15,23,42,0.5);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: var(--r-2xl);
      padding: 28px;
    }
    .panel h2 {
      margin: 0 0 18px 0; font-size: 20px; font-weight: 600; color: white; letter-spacing: -0.01em;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .panel-actions {
      margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
    }
    .panel-actions h3 {
      font-size: 11px; font-family: var(--mono); color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin: 0 0 12px 0;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row input, .row select { flex: 1; min-width: 0; }
    .row button { flex-shrink: 0; }

    .item-list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      background: rgba(2,6,23,0.5); border: 1px solid var(--border);
      border-radius: var(--r-lg); transition: border-color 0.12s ease;
    }
    .item:hover { border-color: var(--slate-700); }
    .item-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
    .item-email { font-family: var(--mono); font-size: 13px; color: white; overflow: hidden; text-overflow: ellipsis; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .item-sub { font-size: 11px; color: var(--text-mute); font-family: var(--mono); }
    .item-actions { display: flex; gap: 6px; flex-shrink: 0; margin-left: 16px; }

    .invite-link-banner {
      margin-top: 18px; padding: 18px;
      background: linear-gradient(135deg, rgba(45,212,191,0.08), rgba(6,182,212,0.08));
      border: 1px solid rgba(45,212,191,0.3); border-radius: var(--r-xl);
    }
    .invite-link-banner-title { font-size: 11px; font-family: var(--mono); color: var(--teal-400); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .invite-link {
      display: flex; gap: 8px; align-items: center;
      background: rgba(2,6,23,0.5); border: 1px solid var(--border-strong); border-radius: var(--r-md);
      padding: 8px 10px;
    }
    .invite-link input { border: none; padding: 0; background: transparent; font-size: 11px; }
    .invite-link button { padding: 5px 12px; font-size: 12px; }
    .invite-link-hint { font-size: 12px; color: var(--text-mute); margin-top: 10px; line-height: 1.5; }

    .empty-state { padding: 32px; text-align: center; color: var(--text-mute); font-size: 13px; }

    /* Audit log */
    .audit-row {
      display: grid; grid-template-columns: 110px 130px 1fr 110px;
      gap: 14px; padding: 9px 12px; border-bottom: 1px solid var(--border);
      align-items: center; font-family: var(--mono); font-size: 11px;
    }
    .audit-row:last-child { border-bottom: none; }
    .audit-row .ts { color: var(--text-mute); }
    .audit-row .action { color: var(--teal-400); }
    .audit-row .action.fail { color: var(--danger); }
    .audit-row .action.warn { color: var(--warn); }
    .audit-row .email { overflow: hidden; text-overflow: ellipsis; }
    .audit-row .ip { color: var(--text-mute); }
    .audit-filters {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .audit-filters select, .audit-filters input {
      font-size: 12px; padding: 7px 10px; width: auto;
    }
    .audit-panel {
      max-height: 480px; overflow-y: auto;
      background: rgba(2,6,23,0.5); border: 1px solid var(--border); border-radius: var(--r-lg);
    }
    .lockout-badge {
      font-size: 9px; padding: 1px 6px; border-radius: var(--r-sm);
      color: var(--warn); border: 1px solid rgba(251,191,36,0.5); background: rgba(251,191,36,0.08);
      letter-spacing: 0.04em; text-transform: uppercase;
      font-family: var(--mono);
    }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: rgba(15,23,42,0.95);
      border: 1px solid var(--ok); color: var(--ok);
      padding: 12px 18px; border-radius: var(--r-md); font-size: 13px;
      box-shadow: var(--shadow-lg);
      animation: toast-anim 2.4s forwards;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .toast.err { border-color: var(--danger); color: var(--danger); }
    @keyframes toast-anim {
      0% { opacity: 0; transform: translateY(10px); }
      10%, 90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
  </style>
</head>
<body class="bg-gradient-page">

  <div class="orbs">
    <div class="orb orb-tl"></div>
    <div class="orb orb-br"></div>
  </div>

  <div class="page-content">
    <header class="topbar">
      <a href="/" class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">KeyVault Sidekick</span>
          <span class="brand-sub">by VibeProSoft</span>
        </span>
      </a>
      <div class="topbar-actions">
        <a href="/connect.html" class="btn ghost" title="Quick Connect to Claude Code">⚡ Connect</a>
        <a href="/account.html" class="btn ghost">Account</a>
        <a href="/app.html" class="btn">Open vault →</a>
        <button type="button" id="logout-btn">Sign out</button>
      </div>
    </header>

    <main>
      <div>
        <div class="page-eyebrow">Administration</div>
        <h1 class="page-title">User management</h1>
        <p class="page-lede">Add users directly with an initial password, or send them a one-time invitation link.</p>
      </div>

      <div class="admin-grid">

        <div class="panel">
          <h2>Users</h2>
          <div class="panel-actions">
            <h3>Create user</h3>
            <div class="row" style="margin-bottom: 8px;">
              <input type="email" id="cu-email" placeholder="user@example.com">
            </div>
            <div class="row">
              <input type="text" id="cu-password" placeholder="Initial password">
              <select id="cu-role" style="flex: 0 0 130px;">
                <option value="user" selected>User</option>
                <option value="superadmin">Superadmin</option>
              </select>
              <button type="button" class="primary" id="cu-submit">Create</button>
            </div>
            <div id="cu-error" class="error" style="display:none"></div>
          </div>
          <div id="users-list" class="item-list">
            <div class="empty-state">Loading…</div>
          </div>
        </div>

        <div class="panel">
          <h2>Invitations</h2>
          <div class="panel-actions">
            <h3>Send invitation</h3>
            <div class="row">
              <input type="email" id="inv-email" placeholder="user@example.com">
              <select id="inv-role" style="flex: 0 0 130px;">
                <option value="user" selected>User</option>
                <option value="superadmin">Superadmin</option>
              </select>
              <button type="button" class="primary" id="inv-submit">Generate link</button>
            </div>
            <div id="inv-error" class="error" style="display:none"></div>
            <div id="inv-link-box"></div>
          </div>
          <div id="invitations-list" class="item-list">
            <div class="empty-state">Loading…</div>
          </div>
        </div>

      </div>

      <div class="panel" style="margin-top: 28px;">
        <h2>Audit log
          <button type="button" id="audit-refresh" class="ghost" style="font-size: 12px;">Refresh</button>
        </h2>
        <div class="audit-filters">
          <select id="audit-action-filter">
            <option value="">All actions</option>
            <option value="login_success">login_success</option>
            <option value="login_failure">login_failure</option>
            <option value="login_locked">login_locked</option>
            <option value="logout">logout</option>
            <option value="password_changed">password_changed</option>
            <option value="password_change_failed">password_change_failed</option>
            <option value="user_created">user_created</option>
            <option value="user_deleted">user_deleted</option>
            <option value="user_modified">user_modified</option>
            <option value="invitation_created">invitation_created</option>
            <option value="invitation_revoked">invitation_revoked</option>
            <option value="invitation_accepted">invitation_accepted</option>
          </select>
          <input type="email" id="audit-email-filter" placeholder="Filter by email" style="flex: 1; min-width: 200px;">
          <input type="text" id="audit-ip-filter" placeholder="Filter by IP" style="width: 140px;">
          <button type="button" id="audit-apply" class="primary" style="font-size: 12px;">Apply</button>
          <button type="button" id="audit-clear" class="ghost" style="font-size: 12px;">Clear</button>
        </div>
        <div id="audit-list" class="audit-panel">
          <div class="empty-state">Loading…</div>
        </div>
      </div>

    </main>
  </div>

  <div id="toast-root" aria-live="polite"></div>

  <script>
    let me = null;
    fetch('/api/auth/me', { credentials: 'same-origin' }).then(async r => {
      if (!r.ok) { window.location.href = '/login.html'; return; }
      const data = await r.json();
      me = data.user;
      if (me.role !== 'superadmin') { window.location.href = '/app.html'; return; }
      loadUsers();
      loadInvitations();
      loadAuditLog();
    });

    const $ = id => document.getElementById(id);
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function showError(elId, msg) {
      const el = $(elId); el.textContent = msg; el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 4000);
    }
    function showToast(text, kind) {
      const t = document.createElement('div');
      t.className = 'toast ' + (kind || '');
      t.textContent = text;
      $('toast-root').appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }
    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toISOString().slice(0, 10);
    }

    async function loadUsers() {
      const list = $('users-list');
      try {
        const r = await fetch('/api/admin/users', { credentials: 'same-origin' });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Failed to load users.');
        if (!data.users.length) { list.innerHTML = '<div class="empty-state">No users.</div>'; return; }
        list.innerHTML = data.users.map(u => `
          <div class="item" data-user-id="${escapeHtml(u.id)}">
            <div class="item-meta">
              <div class="item-email">${escapeHtml(u.email)}
                <span class="badge ${u.role === 'superadmin' ? 'badge-purple' : ''}">${u.role}</span>
                <span class="badge ${u.status === 'active' ? 'badge-ok' : ''}">${u.status}</span>
                ${u.locked_until ? `<span class="lockout-badge" title="Unlocks at ${escapeHtml(u.locked_until)}">LOCKED</span>` : ''}
              </div>
              <div class="item-sub">Created ${fmtDate(u.created_at)}${u.last_login ? ' · last login ' + fmtDate(u.last_login) : ''}${u.locked_until ? ' · unlocks ' + fmtDate(u.locked_until) : ''}</div>
            </div>
            <div class="item-actions">
              ${u.id === me.id ? '<span class="badge badge-accent">You</span>' : `<button type="button" class="danger" data-action="delete">Delete</button>`}
            </div>
          </div>
        `).join('');
        list.querySelectorAll('button[data-action="delete"]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.closest('.item').dataset.userId;
            if (!confirm('Permanently delete this user? This cannot be undone.')) return;
            btn.disabled = true;
            const r = await fetch(`/api/admin/users/${encodeURIComponent(id)}`, { method: 'DELETE', credentials: 'same-origin' });
            const data = await r.json().catch(()=>({}));
            if (!r.ok) { showToast(data.error || 'Delete failed', 'err'); btn.disabled = false; return; }
            showToast('User deleted'); loadUsers();
          });
        });
      } catch (err) {
        list.innerHTML = `<div class="empty-state">Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    $('cu-submit').addEventListener('click', async () => {
      const btn = $('cu-submit');
      const email = $('cu-email').value.trim();
      const password = $('cu-password').value;
      const role = $('cu-role').value;
      if (!email || !password) { showError('cu-error', 'Email and password are required.'); return; }
      btn.disabled = true;
      const r = await fetch('/api/admin/users', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role })
      });
      const data = await r.json().catch(() => ({}));
      btn.disabled = false;
      if (!r.ok) { showError('cu-error', data.error || 'Create failed.'); return; }
      $('cu-email').value = ''; $('cu-password').value = '';
      showToast('User created'); loadUsers();
    });

    async function loadInvitations() {
      const list = $('invitations-list');
      try {
        const r = await fetch('/api/admin/invitations', { credentials: 'same-origin' });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Failed to load invitations.');
        if (!data.invitations.length) { list.innerHTML = '<div class="empty-state">No invitations.</div>'; return; }
        list.innerHTML = data.invitations.map(inv => `
          <div class="item" data-inv-id="${escapeHtml(inv.id)}" data-state="${escapeHtml(inv.state)}">
            <div class="item-meta">
              <div class="item-email">${escapeHtml(inv.email)}
                <span class="badge ${inv.state === 'pending' ? 'badge-warn' : inv.state === 'accepted' ? 'badge-ok' : inv.state === 'revoked' ? 'badge-danger' : ''}">${inv.state}</span>
                <span class="badge ${inv.role === 'superadmin' ? 'badge-purple' : ''}">${inv.role}</span>
              </div>
              <div class="item-sub">
                Created ${fmtDate(inv.created_at)}
                ${inv.state === 'pending' ? '· expires ' + fmtDate(inv.expires_at) : ''}
                ${inv.accepted_at ? '· accepted ' + fmtDate(inv.accepted_at) : ''}
                ${inv.revoked_at ? '· revoked ' + fmtDate(inv.revoked_at) : ''}
              </div>
            </div>
            <div class="item-actions">
              ${inv.state === 'pending' ? '<button type="button" class="danger" data-action="revoke">Revoke</button>' : ''}
            </div>
          </div>
        `).join('');
        list.querySelectorAll('button[data-action="revoke"]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.closest('.item').dataset.invId;
            if (!confirm('Revoke this invitation? The link will stop working.')) return;
            btn.disabled = true;
            const r = await fetch(`/api/admin/invitations/${encodeURIComponent(id)}`, { method: 'DELETE', credentials: 'same-origin' });
            const data = await r.json().catch(()=>({}));
            if (!r.ok) { showToast(data.error || 'Revoke failed', 'err'); btn.disabled = false; return; }
            showToast('Invitation revoked'); loadInvitations();
          });
        });
      } catch (err) {
        list.innerHTML = `<div class="empty-state">Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    $('inv-submit').addEventListener('click', async () => {
      const btn = $('inv-submit');
      const email = $('inv-email').value.trim();
      const role = $('inv-role').value;
      if (!email) { showError('inv-error', 'Email is required.'); return; }
      btn.disabled = true;
      const r = await fetch('/api/admin/invitations', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, role })
      });
      const data = await r.json().catch(() => ({}));
      btn.disabled = false;
      if (!r.ok) { showError('inv-error', data.error || 'Create failed.'); return; }
      $('inv-email').value = '';
      $('inv-link-box').innerHTML = `
        <div class="invite-link-banner">
          <div class="invite-link-banner-title">One-time link — copy and send NOW</div>
          <div class="invite-link">
            <input type="text" id="link-input" readonly value="${escapeHtml(data.inviteUrl)}">
            <button type="button" class="primary" id="copy-link">Copy</button>
          </div>
          <div class="invite-link-hint">
            This link will not appear again. Send it to <strong>${escapeHtml(data.invitation.email)}</strong>
            via email, Slack, or another secure channel. It expires in 7 days.
          </div>
        </div>
      `;
      document.getElementById('copy-link').addEventListener('click', async () => {
        const input = document.getElementById('link-input');
        try { await navigator.clipboard.writeText(input.value); showToast('Invitation link copied'); }
        catch { input.select(); showToast('Press Ctrl+C / Cmd+C to copy', 'err'); }
      });
      loadInvitations();
    });

    // Audit log
    function actionClass(action) {
      if (action === 'login_failure' || action === 'login_locked' || action === 'user_deleted' || action === 'invitation_revoked' || action === 'password_change_failed') return 'fail';
      if (action === 'user_modified' || action === 'password_changed') return 'warn';
      return '';
    }
    function fmtDateTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    async function loadAuditLog() {
      const list = $('audit-list');
      const params = new URLSearchParams();
      const action = $('audit-action-filter').value.trim();
      const email = $('audit-email-filter').value.trim();
      const ip = $('audit-ip-filter').value.trim();
      if (action) params.set('action', action);
      if (email) params.set('email', email);
      if (ip) params.set('ip', ip);
      params.set('limit', '200');
      try {
        const r = await fetch('/api/admin/audit-log?' + params.toString(), { credentials: 'same-origin' });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Failed to load audit log.');
        if (!data.events.length) { list.innerHTML = '<div class="empty-state">No matching events.</div>'; return; }
        list.innerHTML = data.events.map(ev => {
          const detailsStr = ev.details ? JSON.stringify(ev.details) : '';
          const detailsTrunc = detailsStr.length > 80 ? detailsStr.slice(0, 80) + '…' : detailsStr;
          return `
            <div class="audit-row" title="${escapeHtml(detailsStr)}">
              <span class="ts">${fmtDateTime(ev.created_at)}</span>
              <span class="action ${actionClass(ev.action)}">${escapeHtml(ev.action)}</span>
              <span class="email" title="${escapeHtml(ev.email || '')}">${escapeHtml(ev.email || '—')}<span style="color:var(--text-mute)"> · ${escapeHtml(detailsTrunc)}</span></span>
              <span class="ip">${escapeHtml(ev.ip)}</span>
            </div>
          `;
        }).join('');
      } catch (err) {
        list.innerHTML = `<div class="empty-state">Error: ${escapeHtml(err.message)}</div>`;
      }
    }
    $('audit-apply').addEventListener('click', loadAuditLog);
    $('audit-refresh').addEventListener('click', loadAuditLog);
    $('audit-clear').addEventListener('click', () => {
      $('audit-action-filter').value = ''; $('audit-email-filter').value = ''; $('audit-ip-filter').value = '';
      loadAuditLog();
    });

    $('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
