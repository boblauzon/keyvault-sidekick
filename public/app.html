      // ── Guide / help screen ───────────────────────────────────────────────────
      function showGuide() {
        setStatusChip('unlocked');
        mainEl.innerHTML = `
          <div class="screen">
            <div class="screen-header">
              <div>
                <h1>Guide</h1>
                <p class="meta">Claude Code integration and security overview.</p>
              </div>
            </div>
            <div class="guide-layout">

              <!-- ── CLAUDE CODE INTEGRATION ───────────────────────────────── -->
              <div class="guide-section">
                <h2>Claude Code integration</h2>

                <p>
                  KeyVault Sidekick can receive keys that Claude creates via MCP tools (Stripe,
                  Cloudflare, Clerk, etc.) — without you ever seeing the raw value in chat.
                  Claude embeds the key in a URL fragment and navigates your browser to the vault,
                  which auto-opens a pre-filled "Save key" modal.
                </p>

                <div class="guide-callout">
                  <strong>Prerequisite:</strong> The vault must be running — either at
                  <code>http://localhost:8091</code> (local) or
                  <code>https://keyvault-sidekick.pages.dev</code> (hosted).
                  Tell Claude which URL you're using.
                </div>

                <div class="guide-steps">
                  <div class="guide-step">
                    <div class="guide-step-num">1</div>
                    <div class="guide-step-body">
                      <strong>Ask Claude to create and save a key.</strong><br>
                      Example prompts:
                      <div class="guide-code"><span class="cm"># Stripe</span>
"Create a Stripe restricted API key for ITIL Sidekick and save it to
 my KeyVault at http://localhost:8091 in a project called ITIL Sidekick"

<span class="cm"># Cloudflare</span>
"Create a Cloudflare API token scoped to the ct-sidekick.com zone
 and prefill it into my KeyVault project 'CT Sidekick'"

<span class="cm"># Any secret value</span>
"Generate a 256-bit JWT signing secret and save it to KeyVault as
 JWT_SECRET in project 'ITIL Sidekick'"</div>
                    </div>
                  </div>
                  <div class="guide-step">
                    <div class="guide-step-num">2</div>
                    <div class="guide-step-body">
                      <strong>Claude navigates your browser to the vault URL.</strong><br>
                      The key value is embedded in the URL fragment (the <code>#...</code> part),
                      which is never transmitted to the server:
                      <div class="guide-code"><span class="kw">http://localhost:8091/</span>#action=prefill
  &amp;name=STRIPE_RESTRICTED_KEY
  &amp;value=rk_live_51abc…
  &amp;type=api_key
  &amp;project=ITIL+Sidekick
  &amp;notes=Charges+only%2C+no+refunds</div>
                    </div>
                  </div>
                  <div class="guide-step">
                    <div class="guide-step-num">3</div>
                    <div class="guide-step-body">
                      <strong>The vault strips the fragment and stores the data locally.</strong><br>
                      The key value is moved to <code>sessionStorage</code> and the URL is
                      cleaned via <code>history.replaceState</code> — it disappears from the
                      browser bar immediately.
                    </div>
                  </div>
                  <div class="guide-step">
                    <div class="guide-step-num">4</div>
                    <div class="guide-step-body">
                      <strong>Unlock the vault</strong> (if locked) with your master password.<br>
                      The <strong>⚡ Save key from Claude</strong> modal opens automatically
                      with all fields pre-filled. If the vault was already unlocked, the modal
                      opens immediately.
                    </div>
                  </div>
                  <div class="guide-step">
                    <div class="guide-step-num">5</div>
                    <div class="guide-step-body">
                      <strong>Review and click Save key.</strong><br>
                      The key is encrypted and saved to your vault. The
                      <code>sessionStorage</code> entry is cleared — the value no longer
                      exists anywhere outside your encrypted vault.
                    </div>
                  </div>
                </div>

                <h2 style="font-size:11px;margin-top:24px">URL parameters</h2>
                <div class="guide-props">
                  <div class="guide-prop">
                    <span class="guide-prop-name">action</span>
                    <span class="guide-prop-req">required</span>
                    <span class="guide-prop-desc">Must be <code>prefill</code>.</span>
                  </div>
                  <div class="guide-prop">
                    <span class="guide-prop-name">name</span>
                    <span class="guide-prop-req">required</span>
                    <span class="guide-prop-desc">Key name, e.g. <code>STRIPE_API_KEY</code>.</span>
                  </div>
                  <div class="guide-prop">
                    <span class="guide-prop-name">value</span>
                    <span class="guide-prop-req">required</span>
                    <span class="guide-prop-desc">The secret value.</span>
                  </div>
                  <div class="guide-prop">
                    <span class="guide-prop-name">type</span>
                    <span class="guide-prop-req" style="color:var(--text-mute)">optional</span>
                    <span class="guide-prop-desc"><code>api_key</code> / <code>secret</code> / <code>token</code> / <code>oauth</code> / <code>webhook</code> / <code>other</code>. Default: <code>api_key</code>.</span>
                  </div>
                  <div class="guide-prop">
                    <span class="guide-prop-name">project</span>
                    <span class="guide-prop-req" style="color:var(--text-mute)">optional</span>
                    <span class="guide-prop-desc">Project name or ID. Fuzzy-matched: exact ID → exact name → partial name → first project.</span>
                  </div>
                  <div class="guide-prop">
                    <span class="guide-prop-name">notes</span>
                    <span class="guide-prop-req" style="color:var(--text-mute)">optional</span>
                    <span class="guide-prop-desc">Free-text notes, URL-encoded.</span>
                  </div>
                </div>

                <div class="guide-warn-callout">
                  <strong>If you close the tab before unlocking:</strong> the key stored in
                  <code>sessionStorage</code> is gone — sessionStorage does not survive tab
                  close. Ask Claude to regenerate the key and resend the prefill URL.
                </div>
              </div>

              <!-- ── SECURITY ───────────────────────────────────────────────── -->
              <div class="guide-section">
                <h2>Security model</h2>

                <p>
                  KeyVault Sidekick is designed so that a server breach, a network intercept,
                  or a compromised CDN cannot expose your secrets. Here's exactly how each
                  layer works.
                </p>

                <div class="sec-props">
                  <div class="sec-prop">
                    <div class="sec-prop-icon">🔐</div>
                    <div class="sec-prop-body">
                      <div class="sec-prop-title">AES-256-GCM encryption at rest</div>
                      <div class="sec-prop-detail">
                        Every vault save encrypts the entire JSON payload with AES-256-GCM
                        using a fresh random 12-byte IV. The <code>localStorage</code> entry
                        is pure ciphertext — key names and values are never written in plaintext.
                        GCM mode also provides authentication, so a tampered blob will fail
                        to decrypt rather than silently returning garbage.
                      </div>
                    </div>
                  </div>
                  <div class="sec-prop">
                    <div class="sec-prop-icon">🔑</div>
                    <div class="sec-prop-body">
                      <div class="sec-prop-title">Master password — never stored, never transmitted</div>
                      <div class="sec-prop-detail">
                        Your password is run through <strong>PBKDF2 (310,000 iterations,
                        SHA-256, random 16-byte salt)</strong> to derive the AES key.
                        The derived key lives in JS memory only — it is never written to
                        disk in any form. The password itself is also never stored.
                        310,000 iterations is the OWASP 2024 recommendation; it makes
                        brute-force attacks on a stolen blob computationally expensive.
                      </div>
                    </div>
                  </div>
                  <div class="sec-prop">
                    <div class="sec-prop-icon">🔗</div>
                    <div class="sec-prop-body">
                      <div class="sec-prop-title">URL fragment security (prefill hook)</div>
                      <div class="sec-prop-detail">
                        The <code>#fragment</code> portion of a URL is a browser-only
                        construct — it is <strong>never sent to the HTTP server</strong> in
                        any request. Whether you use the local server or
                        <code>keyvault-sidekick.pages.dev</code>, the secret value in
                        <code>#…&amp;value=sk_live_xxx</code> never leaves your browser.
                        The fragment is also stripped from the URL bar immediately
                        (<code>history.replaceState</code>) and the value moves to
                        <code>sessionStorage</code>, which is tab-local and not written
                        to disk by the browser.
                      </div>
                    </div>
                  </div>
                  <div class="sec-prop">
                    <div class="sec-prop-icon">🚫</div>
                    <div class="sec-prop-body">
                      <div class="sec-prop-title">No outbound network requests — ever</div>
                      <div class="sec-prop-detail">
                        The Content Security Policy enforces <code>connect-src 'none'</code>,
                        which means the page cannot make any HTTP requests, WebSocket
                        connections, or fetch calls — even to the same origin. There are
                        no analytics, no error reporting, no fonts loaded from CDNs,
                        no external scripts. The app works fully offline after the first
                        page load.
                      </div>
                    </div>
                  </div>
                  <div class="sec-prop">
                    <div class="sec-prop-icon">📋</div>
                    <div class="sec-prop-body">
                      <div class="sec-prop-title">Clipboard auto-clear</div>
                      <div class="sec-prop-detail">
                        After you copy a key value, the clipboard is automatically
                        cleared after your configured delay (default 30 seconds).
                        The clear is conditional — it reads the clipboard first and only
                        wipes it if it still contains your copied value, so it won't
                        clobber something you copied from another app.
                        Configurable in Settings, or disable it entirely.
                      </div>
                    </div>
                  </div>
                  <div class="sec-prop">
                    <div class="sec-prop-icon">⏱</div>
                    <div class="sec-prop-body">
                      <div class="sec-prop-title">Auto-lock on idle</div>
                      <div class="sec-prop-detail">
                        The vault locks automatically after a configurable period of
                        inactivity (default 15 minutes). Locking clears the derived
                        AES key from memory — the vault cannot be read without
                        re-entering your master password. Also locks if the vault
                        is modified in another browser tab.
                      </div>
                    </div>
                  </div>
                  <div class="sec-prop">
                    <div class="sec-prop-icon">⏩</div>
                    <div class="sec-prop-body">
                      <div class="sec-prop-title">Forward-compatible KDF</div>
                      <div class="sec-prop-detail">
                        The PBKDF2 parameters (iterations, hash algorithm, salt) are
                        stored inside the encrypted blob and read back at unlock time —
                        they are not hardcoded in the app. This means a future
                        iteration-count increase will not silently break vaults created
                        with the current parameters. Old vaults will still unlock
                        correctly; new vaults will use the updated parameters.
                      </div>
                    </div>
                  </div>
                  <div class="sec-prop">
                    <div class="sec-prop-icon">🔍</div>
                    <div class="sec-prop-body">
                      <div class="sec-prop-title">Single-file, auditable source</div>
                      <div class="sec-prop-detail">
                        The entire application is one <code>index.html</code> file (~2300 lines).
                        No minification, no obfuscation, no build step, no bundled
                        dependencies. You can read the full source with browser View Source
                        right now. The source is also on GitHub at
                        <strong>github.com/boblauzon/keyvault-sidekick</strong>.
                      </div>
                    </div>
                  </div>
                  <div class="sec-prop">
                    <div class="sec-prop-icon">⚠️</div>
                    <div class="sec-prop-body">
                      <div class="sec-prop-title">No password recovery — by design</div>
                      <div class="sec-prop-detail">
                        There is no "forgot password" flow, no recovery email, no
                        support channel that can unlock your vault. If you lose your
                        master password, the vault is permanently inaccessible.
                        Export a <code>.vault</code> file backup (Settings → Vault backup)
                        and keep it somewhere safe alongside a record of your master password.
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ── INTEGRITY VERIFICATION ─────────────────────────────────── -->
              <div class="guide-section" id="integrity-section">
                <h2>Integrity verification</h2>

                <p>
                  The hosted version at <code>keyvault-sidekick.pages.dev</code> is served by
                  Cloudflare Pages. The single risk this hosting model carries is
                  <strong>supply-chain compromise</strong>: if our Cloudflare account were
                  ever taken over, an attacker could push a modified <code>index.html</code>
                  that exfiltrates your vault after you unlock. Here's how to detect that —
                  and, if you want zero CDN trust, how to run KeyVault Sidekick from your own
                  machine instead.
                </p>

                <h2 style="font-size:11px;margin-top:24px">This page's runtime hash</h2>

                <div class="integrity-panel">
                  <div class="integrity-row">
                    <div class="integrity-label">SHA-256:</div>
                    <code class="integrity-hash-full" id="guide-integrity-hash">computing…</code>
                    <button type="button" id="copy-integrity-hash">Copy hash</button>
                  </div>
                </div>

                <p style="font-size:12px;color:var(--text-mute)">
                  This hash is computed from <code>document.documentElement.outerHTML</code> —
                  what the browser produced after parsing the HTML. It's a
                  <strong>self-consistency check</strong>: as long as it's stable across
                  reloads, the page you're using hasn't been tampered with mid-session.
                  Browser DOM serialization isn't bit-identical to raw source bytes,
                  so this runtime hash is <strong>not directly comparable</strong> to the
                  hash <code>certutil</code> would compute on a downloaded file.
                </p>

                <h2 style="font-size:11px;margin-top:32px">Verify the CDN — the real way</h2>

                <p>
                  To verify Cloudflare Pages is serving the exact code committed to this
                  repo, fetch the raw bytes with <code>curl</code> (bypassing any browser
                  serialization) and compare with the file hash in the GitHub release:
                </p>

                <div class="guide-code"><span class="cm"># 1. Fetch raw HTML directly</span>
curl -o keyvault.html https://keyvault-sidekick.pages.dev/

<span class="cm"># 2. Hash it</span>
certutil -hashfile keyvault.html SHA256     <span class="cm"># Windows</span>
shasum -a 256 keyvault.html                 <span class="cm"># macOS / Linux</span>

<span class="cm"># 3. Compare with the "File hash (raw source)" in the release notes:</span>
<span class="cm">#    https://github.com/boblauzon/keyvault-sidekick/releases</span></div>

                <div class="guide-callout">
                  <strong>If the hashes match</strong> → the CDN is serving the exact
                  code published to GitHub. You can trust it.<br>
                  <strong>If they differ</strong> → don't enter your master password.
                  Use the offline copy below, or <code>git clone</code> the repo.
                </div>

                <h2 style="font-size:11px;margin-top:32px">Run locally — maximum trust</h2>

                <p>
                  For zero CDN trust, run KeyVault Sidekick from your own machine.
                  The app works identically from <code>file://</code>, with no server needed.
                </p>

                <div class="guide-steps">
                  <div class="guide-step">
                    <div class="guide-step-num">A</div>
                    <div class="guide-step-body">
                      <strong>Save an offline copy.</strong>
                      Click the button below — it downloads the HTML currently loaded
                      in this tab so you can run the app without a network.
                      <div style="margin-top:10px">
                        <button type="button" class="primary" id="save-offline-btn">Save offline copy</button>
                      </div>
                      <div style="margin-top:8px;font-size:11px;color:var(--text-mute);line-height:1.5">
                        Note: this is the <strong>browser-serialized</strong> form of the
                        page. It runs identically but is not byte-identical to the raw
                        source in the repo. For hash verification, use <code>curl</code>
                        as shown above.
                      </div>
                    </div>
                  </div>
                  <div class="guide-step">
                    <div class="guide-step-num">B</div>
                    <div class="guide-step-body">
                      <strong>Open the file.</strong>
                      Double-click <code>keyvault-sidekick.html</code> — your browser
                      will open it from <code>file://</code>. Same Web Crypto, same
                      localStorage, no network involved.
                    </div>
                  </div>
                  <div class="guide-step">
                    <div class="guide-step-num">C</div>
                    <div class="guide-step-body">
                      <strong>Or clone from GitHub directly</strong> — most auditable:
                      <div class="guide-code">git clone https://github.com/boblauzon/keyvault-sidekick.git
cd keyvault-sidekick
py -3 -m http.server 8091
<span class="cm"># open http://localhost:8091</span></div>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        `;

        // Populate the integrity hash + wire buttons after the guide renders
        __integrityHashPromise.then(hash => {
          const el = document.getElementById('guide-integrity-hash');
          if (!el) return;
          if (hash) {
            el.textContent = hash;
          } else {
            el.textContent = 'unavailable (crypto.subtle failed)';
            el.style.color = 'var(--text-mute)';
          }
        });

        const copyBtn = document.getElementById('copy-integrity-hash');
        if (copyBtn) {
          copyBtn.addEventListener('click', async () => {
            const hash = await __integrityHashPromise;
            if (!hash) { showToast('Hash unavailable', 'err'); return; }
            try { await copyToClipboard(hash); showToast('Hash copied'); }
            catch { showToast('Could not copy', 'err'); }
          });
        }

        const saveBtn = document.getElementById('save-offline-btn');
        if (saveBtn) {
          saveBtn.addEventListener('click', () => {
            try {
              downloadText(__initialHTML, 'keyvault-sidekick.html');
              showToast('Offline copy downloaded');
            } catch (err) {
              showToast('Download failed: ' + (err.message || 'unknown'), 'err');
            }
          });
        }
      }

      // ── Change master password modal ──────────────────────────────────────────
      function openChangePasswordModal() {
        openModal({
          title: 'Change master password',
          body: `
            <form id="cp-form" novalidate>
              <div class="field">
                <label for="cp-current">Current password</label>
                <input type="password" id="cp-current" autocomplete="off" required>
              </div>
              <div class="field">
                <label for="cp-new">New password</label>
                <input type="password" id="cp-new" autocomplete="off" minlength="8" required>
                <div class="field-hint">Minimum 8 characters.</div>
              </div>
              <div class="field">
                <label for="cp-confirm">Confirm new password</label>
                <input type="password" id="cp-confirm" autocomplete="off" required>
              </div>
              <div id="cp-error" class="error" role="alert" style="display:none"></div>
            </form>`,
          footer: `
            <button type="button" id="cp-cancel">Cancel</button>
            <button type="button" class="primary" id="cp-save">Change password</button>`,
          onMount: (root) => {
            const errEl = root.querySelector('#cp-error');
            const currentIn = root.querySelector('#cp-current');
            const newIn = root.querySelector('#cp-new');
            const confirmIn = root.querySelector('#cp-confirm');
            const saveBtn = root.querySelector('#cp-save');
            root.querySelector('#cp-cancel').addEventListener('click', closeModal);

            async function submit() {
              errEl.style.display = 'none';
              const cur = currentIn.value;
              const nw = newIn.value;
              const cf = confirmIn.value;
              if (!cur) { errEl.textContent = 'Current password is required.'; errEl.style.display = 'block'; return; }
              if (nw.length < 8) { errEl.textContent = 'New password must be at least 8 characters.'; errEl.style.display = 'block'; return; }
              if (nw !== cf) { errEl.textContent = 'New passwords do not match.'; errEl.style.display = 'block'; return; }
              saveBtn.disabled = true; saveBtn.textContent = 'Changing…';
              try {
                // Verify current password by re-decrypting
                const normCur = VaultCrypto.normalizePassword(cur);
                const blob = VaultStorage.load();
                if (!blob) throw new Error('No vault found.');
                validateBlob(blob);
                const oldSalt = VaultCrypto.fromBase64(blob.kdf.salt);
                const testKey = await VaultCrypto.deriveKey(normCur, oldSalt, blob.kdf.iterations, blob.kdf.hash);
                try { await VaultCrypto.decrypt(blob.cipher, testKey); }
                catch (err) {
                  if (err && err.name === 'OperationError') throw new Error('Incorrect current password.');
                  throw err;
                }
                // Re-encrypt with new password + fresh salt
                const normNew = VaultCrypto.normalizePassword(nw);
                const newSalt = VaultCrypto.generateSalt();
                const newKey = await VaultCrypto.deriveKey(normNew, newSalt);
                const newIter = VaultCrypto.PBKDF2_ITERATIONS;
                await encryptAndSave(VaultState.getVault(), newKey, newSalt, newIter);
                VaultState.unlock(newKey, newSalt, VaultState.getVault(), newIter);
                closeModal();
                showToast('Master password changed');
              } catch (err) {
                errEl.textContent = err.message || 'Failed to change password.';
                errEl.style.display = 'block';
                saveBtn.disabled = false; saveBtn.textContent = 'Change password';
              }
            }

            saveBtn.addEventListener('click', submit);
            root.querySelector('#cp-form').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
            currentIn.focus();
          }
        });
      }

      // ── Vault backup / restore ────────────────────────────────────────────────
      function exportVaultFile() {
        const raw = localStorage.getItem(VaultStorage.STORAGE_KEY);
        if (!raw) { showToast('No vault to export', 'err'); return; }
        const date = new Date().toISOString().slice(0, 10);
        downloadText(raw, `keyvault-backup-${date}.vault`);
        showToast('Vault backup downloaded');
      }

      function importVaultFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const text = e.target.result;
            let parsed;
            try { parsed = JSON.parse(text); }
            catch { showToast('Invalid .vault file: not valid JSON', 'err'); return; }
            try { validateBlob(parsed); }
            catch (err) { showToast('Invalid .vault file: ' + err.message, 'err'); return; }
            localStorage.setItem(VaultStorage.STORAGE_KEY, text);
            stopIdleTimer();
            VaultState.lock();
            pendingNotice = 'Vault restored from backup. Unlock with the backup\'s master password.';
            currentView = 'projects'; currentProjectId = null; searchQuery = ''; revealedKeys = new Set();
            render();
          } catch (err) {
            showToast('Failed to import: ' + (err.message || 'unknown error'), 'err');
          }
        };
        reader.onerror = function() { showToast('Failed to read file', 'err'); };
        reader.readAsText(file);
      }

      // ── URL fragment prefill (Claude Code integration) ────────────────────────
      function checkPrefill() {
        try {
          const raw = sessionStorage.getItem('kvs_prefill');
          if (!raw) return;
          sessionStorage.removeItem('kvs_prefill');
          const params = new URLSearchParams(raw);
          const value = params.get('value');
          if (!value) return;
          const name = params.get('name') || '';
          const type = params.get('type') || 'api_key';
          const notes = params.get('notes') || '';
          const projectHint = params.get('project') || '';
          // Delay slightly so the projects view renders first
          setTimeout(() => openPrefillModal({ name, value, type, notes, projectHint }), 200);
        } catch { /* ignore malformed prefill */ }
      }

      function openPrefillModal({ name, value, type, notes, projectHint }) {
        const vault = VaultState.getVault();
        if (!vault) return;
        const projects = vault.projects.filter(p => !p.archived);
        if (projects.length === 0) {
          openConfirmModal({
            title: 'No projects',
            body: 'A key was passed via URL but you have no projects to save it into. Create a project first.',
            confirmLabel: 'Create project',
            onConfirm: async () => { closeModal(); openProjectModal(null); }
          });
          return;
        }

        // Find best-matching project
        let matchedProject =
          projects.find(p => p.id === projectHint) ||
          projects.find(p => p.name.toLowerCase() === projectHint.toLowerCase()) ||
          (projectHint ? projects.find(p => p.name.toLowerCase().includes(projectHint.toLowerCase())) : null);
        const defaultProjectId = (matchedProject || projects[0]).id;
        const validType = KEY_TYPES.find(t => t.id === type) ? type : 'api_key';

        openModal({
          title: 'Save key from Claude',
          body: `
            <div class="prefill-banner" style="margin-bottom:16px">
              ⚡ A key was passed to KeyVault via URL. <strong>Confirm only if you initiated this request.</strong> Review the value carefully before saving — anyone who could get you to click a link can prefill this modal.
            </div>
            <form id="pf-form" novalidate>
              <div class="field">
                <label for="pf-project">Project</label>
                <select id="pf-project">
                  ${projects.map(p => `<option value="${escapeHtml(p.id)}"${p.id === defaultProjectId ? ' selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label for="pf-name">Key name</label>
                <input type="text" id="pf-name" required maxlength="200" value="${escapeHtml(name)}" autocomplete="off">
              </div>
              <div class="field">
                <label for="pf-type">Type</label>
                <select id="pf-type">
                  ${KEY_TYPES.map(t => `<option value="${t.id}"${t.id === validType ? ' selected' : ''}>${t.label}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label for="pf-notes">Notes (optional)</label>
                <textarea id="pf-notes" rows="2" autocomplete="off">${escapeHtml(notes)}</textarea>
              </div>
              <div class="field">
                <label>Value preview</label>
                <div class="gen-output">${escapeHtml(value.length > 80 ? value.slice(0, 80) + '…' : value)}</div>
              </div>
              <div id="pf-error" class="error" role="alert" style="display:none"></div>
            </form>`,
          footer: `
            <button type="button" id="pf-skip">Skip</button>
            <button type="button" class="primary" id="pf-save">Save key</button>`,
          onMount: (root) => {
            const errEl = root.querySelector('#pf-error');
            const projectSel = root.querySelector('#pf-project');
            const nameIn = root.querySelector('#pf-name');
            const typeSel = root.querySelector('#pf-type');
            const notesIn = root.querySelector('#pf-notes');
            const saveBtn = root.querySelector('#pf-save');
            root.querySelector('#pf-skip').addEventListener('click', closeModal);

            async function submit() {
              errEl.style.display = 'none';
              const keyName = nameIn.value.trim();
              if (!keyName) { errEl.textContent = 'Name is required.'; errEl.style.display = 'block'; return; }
              saveBtn.disabled = true;
              try {
                const projectId = projectSel.value;
                await mutate(vault => {
                  const p = vault.projects.find(p => p.id === projectId);
                  if (!p) throw new Error('Project no longer exists.');
                  const ts = now();
                  p.keys.push({ id: createId(), name: keyName, value, type: typeSel.value, notes: notesIn.value.trim(), createdAt: ts, updatedAt: ts });
                  p.updatedAt = ts;
                });
                const proj = projects.find(p => p.id === projectSel.value);
                closeModal();
                showToast(`Saved ${keyName} to ${proj ? proj.name : 'project'}`);
              } catch (err) {
                errEl.textContent = err.message || 'Save failed.';
                errEl.style.display = 'block';
                saveBtn.disabled = false;
              }
            }

            saveBtn.addEventListener('click', submit);
            root.querySelector('#pf-form').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
            nameIn.focus(); nameIn.select();
          }
        });
      }

      return { init, _internal: { mutate, findProject, findKey } };
    })();

    // Initialize the vault UI once the DOM is ready. No auth, no network.
    function bootApp() {
      App.init();
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
