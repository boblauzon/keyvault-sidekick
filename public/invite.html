<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Accept invitation · KeyVault Sidekick</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    main {
      min-height: calc(100vh - 60px); display: flex;
      align-items: center; justify-content: center; padding: 40px 20px;
    }
    .email-display {
      display: block; padding: 10px 12px;
      background: var(--bg); border: 1px solid var(--border-strong); border-radius: 4px;
      color: var(--accent); font-family: var(--mono); font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">KeyVault Sidekick</span>
      <span class="brand-sub">/ VibeProSoft</span>
    </a>
  </header>

  <main>
    <div class="card" id="loading-card">
      <h1>Verifying invitation…</h1>
      <p class="subtitle" style="margin: 0;">Just a moment.</p>
    </div>

    <div class="card" id="invalid-card" style="display:none">
      <h1>Invitation problem</h1>
      <p class="subtitle" id="invalid-msg"></p>
      <a href="/" class="btn" style="width: 100%; padding: 12px; text-align: center;">Back to home</a>
    </div>

    <div class="card" id="accept-card" style="display:none">
      <h1>Set up your account</h1>
      <p class="subtitle">You've been invited to KeyVault Sidekick. Choose a password to activate your account.</p>
      <div class="field">
        <label>Email</label>
        <span class="email-display" id="email-display"></span>
      </div>
      <form id="accept-form" autocomplete="off" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password">
          <div class="field-hint">Minimum 8 characters. Long passphrases beat short complex ones.</div>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" required autocomplete="new-password">
        </div>
        <button type="submit" class="primary" id="submit" style="width:100%; padding: 12px;">Activate account</button>
        <div id="error" class="error" role="alert" aria-live="polite" style="display:none"></div>
      </form>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const loadingCard = document.getElementById('loading-card');
    const invalidCard = document.getElementById('invalid-card');
    const acceptCard = document.getElementById('accept-card');
    const invalidMsg = document.getElementById('invalid-msg');
    const emailDisplay = document.getElementById('email-display');
    const pwEl = document.getElementById('password');
    const confirmEl = document.getElementById('confirm');
    const submitBtn = document.getElementById('submit');
    const errEl = document.getElementById('error');

    function showError(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }
    function showInvalid(msg) {
      loadingCard.style.display = 'none';
      invalidCard.style.display = 'block';
      invalidMsg.textContent = msg;
    }

    if (!token) { showInvalid('No invitation token in URL.'); }
    else {
      fetch(`/api/auth/invite/${encodeURIComponent(token)}`).then(async r => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { showInvalid(data.error || 'Invitation is invalid.'); return; }
        loadingCard.style.display = 'none';
        acceptCard.style.display = 'block';
        emailDisplay.textContent = data.email;
        pwEl.focus();
      }).catch(() => showInvalid('Network error. Try again later.'));
    }

    document.getElementById('accept-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      if (pwEl.value.length < 8) return showError('Password must be at least 8 characters.');
      if (pwEl.value !== confirmEl.value) return showError('Passwords do not match.');
      submitBtn.disabled = true;
      const oldText = submitBtn.textContent;
      submitBtn.textContent = 'Activating…';
      try {
        const res = await fetch('/api/auth/accept-invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ token, password: pwEl.value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data.error || 'Could not activate account.');
          submitBtn.disabled = false;
          submitBtn.textContent = oldText;
          return;
        }
        window.location.href = '/app.html';
      } catch {
        showError('Network error. Try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = oldText;
      }
    });
  </script>
</body>
</html>
