version: 2
updates:
  # Root: keeps wrangler (and any future runtime dep) patched.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  # MCP package (zero deps today — future-proofing).
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(mcp)

  # Keep the GitHub Actions in security.yml pinned to current versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
